<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Loading...</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: transparent;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }

            .splash-container {
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 40px;
            }

            .logo {
                font-size: 80px;
                margin-bottom: 20px;
                animation: bounce 1.5s ease-in-out infinite;
            }

            @keyframes bounce {
                0%, 100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-20px);
                }
            }

            .app-name {
                font-size: 32px;
                font-weight: 700;
                color: white;
                margin-bottom: 10px;
                letter-spacing: -0.5px;
            }

            .tagline {
                font-size: 14px;
                color: rgba(255, 255, 255, 0.8);
                margin-bottom: 40px;
            }

            .loading-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .loading-text {
                color: white;
                font-size: 14px;
                font-weight: 500;
                opacity: 0.9;
            }

            .status-text {
                color: rgba(255, 255, 255, 0.7);
                font-size: 12px;
                min-height: 18px;
                margin-top: 10px;
            }

            .progress-bar {
                width: 200px;
                height: 4px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 2px;
                overflow: hidden;
                margin-top: 20px;
            }

            .progress-fill {
                height: 100%;
                background: white;
                border-radius: 2px;
                width: 0%;
                transition: width 0.3s ease;
                animation: progress 3s ease-in-out;
            }

            @keyframes progress {
                0% { width: 0%; }
                33% { width: 30%; }
                66% { width: 60%; }
                100% { width: 100%; }
            }

            .version {
                position: absolute;
                bottom: 20px;
                color: rgba(255, 255, 255, 0.6);
                font-size: 11px;
            }
        </style>
    </head>
    <body>
        <div class="splash-container">
            <div class="logo"></div>
            <div class="app-name">Spotlight</div>
            <div class="tagline">for Windows</div>

            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text">Loading...</div>
                <div class="status-text" id="statusText"></div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="version" id="version"></div>
        </div>

        <script>
            const { ipcRenderer } = require('electron');

            // Messages de statut qui défilent
            const statusMessages = [
                'Initializing...',
                'Loading components...',
                'Indexing applications...',
                'Preparing search engine...',
                'Almost ready...'
            ];

            let currentIndex = 0;
            const statusText = document.getElementById('statusText');

            function updateStatus() {
                if(currentIndex < statusMessages.length) {
                    statusText.textContent = statusMessages[currentIndex];
                    currentIndex++;
                    setTimeout(updateStatus, 600);
                }
            }

            updateStatus();

            // Ecouter le message de version depuis main
            window.addEventListener('message', (event) => {
                if(event.data.type === 'version') {
                    document.getElementById('version').textContent = 'v' + event.data.version;
                }
            });

            ipcRenderer.on('indexing-progress', (event, data) => {
                statusText.textContent = data.message;
            });
        </script>
    </body>
</html>
