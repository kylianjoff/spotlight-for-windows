<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Loading...</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: transparent;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            }

            .splash-container {
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 40px;
            }

            .logo {
                font-size: 80px;
                margin-bottom: 20px;
                animation: bounce 1.5s ease-in-out infinite;
            }

            @keyframes bounce {
                0%, 100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-20px);
                }
            }

            .app-name {
                font-size: 32px;
                font-weight: 700;
                color: white;
                margin-bottom: 10px;
                letter-spacing: -0.5px;
            }

            .tagline {
                font-size: 14px;
                color: rgba(255, 255, 255, 0.8);
                margin-bottom: 40px;
            }

            .loading-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .loading-text {
                color: white;
                font-size: 14px;
                font-weight: 500;
                opacity: 0.9;
            }

            .version {
                position: absolute;
                bottom: 20px;
                color: rgba(255, 255, 255, 0.6);
                font-size: 11px;
            }
        </style>
    </head>
    <body>
        <div class="splash-container">
            <div class="logo">🔍</div>
            <div class="app-name">Spotlight</div>
            <div class="tagline">for Windows</div>

            <div class="loading-container">
                <div class="spinner"></div>
                <div class="loading-text">Loading...</div>
            </div>

            <div class="version" id="version"></div>
        </div>
    </body>
</html>
