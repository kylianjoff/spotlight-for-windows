<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spotlight for Windows</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="search-container">
    <input 
      type="text" 
      id="searchInput" 
      data-i18n-placeholder="search.placeholder"
      autofocus
    >
    
    <!-- Section Applications -->
    <div class="section" id="appsSection">
      <div class="section-header">
        <span class="section-icon">⚙️</span>
        <h3 data-i18n="section.applications"></h3>
      </div>
      <div class="section-results" id="appResults"></div>
    </div>

    <!-- Section Fichiers -->
    <div class="section" id="filesSection">
      <div class="section-header">
        <span class="section-icon">📄</span>
        <h3 data-i18n="section.files"></h3>
      </div>
      <div class="section-results" id="fileResults"></div>
    </div>

    <!-- Section Recherche Web -->
    <div class="section" id="webSection">
      <div class="section-header">
        <span class="section-icon">🌐</span>
        <h3 data-i18n="section.web"></h3>
      </div>
      <div class="section-results" id="searchResults"></div>
    </div>

    <!-- Bouton settings et indicateur de mise à jour -->
    <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
    <span id="updateBadge" class="update-badge" style="display: none;">1</span>

  </div>

  <!-- Modal des paramètres -->
    <div id="settingsModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-i18n="settings.title"></h2>
          <button class="modal-close" id="closeSettings">x</button>
        </div>
        <div class="modal-body">

          <!-- Section Mise à jour -->
          <div class="setting-section" id="updateSection" style="display: none;">
            <div class="setting-item update-item">
              <div class="update-header">
                <span class="update-icon">🎉</span>
                <div class="update-info">
                  <h3 data-i18n="settings.updateAvailable"></h3>
                  <p id="updateVersionText" class="update-version">Version <span id="newVersion"></span> disponible</p>
                </div>
              </div>
              <div class="update-actions">
                <button id="downloadUpdateBtn" class="update-btn primary">
                  <span data-i18n="settings.downloadUpdate"></span>
                </button>
                <button id="installUpdateBtn" class="update-btn success" style="display: none;">
                  <span data-i18n="settings.installUpdate"></span>
                </button>
              </div>
              <div id="downloadProgress" class="download-progress" style="display: none;">
                <div class="progress-bar">
                  <div id="progressFill" class="progress-fill"></div>
                </div>
                <p id="progressText" class="progress-text">Téléchargement: 0%</p>
              </div>
            </div>
          </div>

          <!-- Vérification manuelle -->
          <div class="setting-item">
            <label data-i18n="settings.checkUpdates">Vérifier les mises à jour</label>
            <button id="checkUpdatesBtn" class="check-updates-btn">
              <span data-i18n="settings.checkNow"></span>
            </button>
            <p id="updateStatus" class="update-status"></p>
          </div>

          <!-- Langues -->
          <div class="setting-item">
            <label data-i18n="settings.language"></label>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>

          <!-- Auto-launch -->
          <div class="setting-item">
            <label data-i18n="settings.autolaunch"></label>
            <label class="toggle-switch">
              <input type="checkbox" id="autoLaunchToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <!-- Quit Application -->
          <div class="setting-item quit-section">
            <label data-i18n="settings.quitApp"></label>
            <button id="quitAppBtn" class="quit-btn">
              <span data-i18n="settings.quit"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de confirmation Quit -->
    <div id="quitModal" class="modal" style="display: none;">
      <div class="modal-content quit-modal-content">
        <div class="modal-header">
          <h2 data-i18n="settings.confirmQuit"></h2>
          <button id="closeQuitModal" class="modal-close">x</button>
        </div>
        <div class="modal-body">
          <p data-i18n="settings.quitMessage"></p>
          <div class="quit-actions">
            <button id="cancelQuitBtn" class="cancel-btn">
              <span data-i18n="settings.cancel"></span>
            </button>
            <button id="confirmQuitBtn" class="quit-btn">
              <span data-i18n="settings.confirmQuitBtn"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="settings.js"></script>
    <script src="i18n.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
